name: "Bug Report"
description: "Report a reproducible problem or unexpected error in Finora"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Finora.
        
        > **⚠️ Security & Privacy Warning:**
        > Never include passwords, API keys, session tokens, database credentials, real student financial documents, or personally identifiable information (PII) in public issues. For security vulnerabilities, please refer to [SECURITY.md](https://github.com/puneetnith28/Finora/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: "Bug Summary"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., FOIR calculation slider does not update when loan tenure exceeds 120 months."
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: "Affected Subsystem"
      description: "Which part of the platform is impacted?"
      options:
        - "Assessment Wizard (Step 1-6)"
        - "Financial Engine & Calculation Rules (EMI/FOIR/LTV/Net Worth)"
        - "Lender Underwriting & Matching Logic"
        - "Document Intelligence & OCR Reconciliation"
        - "Interactive FOIR Simulator (/simulator)"
        - "Frontend UI / Components / Styles"
        - "Backend REST API (/api/v1)"
        - "CI/CD & Deployment"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Navigate to `/assessment`
        2. Enter student profile details and submit
        3. Move to Study Plan step and enter tuition fee in USD...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What should have happened according to mathematical rules or UI design?"
      placeholder: "The calculated total cost should convert USD to INR at the specified exchange rate."
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened (include error messages, status codes, or visual glitches)?"
      placeholder: "Received HTTP 500 error or calculation showed NaN."
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "Reproducibility"
      description: "Can this issue be reproduced consistently?"
      options:
        - "Always (100% of the time)"
        - "Intermittently / Sometimes"
        - "Rarely / Once only"
    validations:
      required: true

  - type: checkboxes
    id: security_check
    attributes:
      label: "Security and Information Confirmation"
      options:
        - label: "I confirm that no secrets, private API keys, or confidential financial records are included in this report."
          required: true
